# ============================================
# WORKFLOW: CI com Matrix Strategy
# Executa testes em m�ltiplas vers�es do Python
# ============================================
name: ?? CI with Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-matrix:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    # ============================================
    # STRATEGY: Define a matriz de execu��o
    # Cada combina��o gera um job separado
    # ============================================
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.6", "3.13", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run pytest

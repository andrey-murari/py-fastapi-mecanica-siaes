# ============================================
# WORKFLOW: CI Pipeline Multistage
# ============================================
name: 🚀 CI Multistage Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Mesma versão de requires-python no pyproject.toml e da imagem python no Dockerfile.
  PYTHON_VERSION: "3.14.6"

jobs:
  # ============================================
  # STAGE 1: VALIDAÇÃO (Paralelo)
  # Jobs sem "needs" executam em paralelo
  # ============================================
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 🐍 Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: uv sync --locked --group dev

      - name: 🧪 Run tests
        run: uv run pytest

  lint:
    name: 🔍 Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 🐍 Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # O projeto não declara ruff nem pylint. O job confere o lock e a sintaxe.
      - name: 🔍 Check lockfile
        run: uv lock --check

      - name: 🔍 Syntax-check Python sources
        run: uv run --no-project --python ${{ env.PYTHON_VERSION }} python -m compileall -q src tests main.py

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 🐍 Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: 📦 Export locked requirements
        run: uv export --locked --no-dev --no-emit-project --no-hashes --format requirements.txt --output-file "$RUNNER_TEMP/requirements.txt"

      # Reporta CVEs sem bloquear os stages seguintes (mesmo papel do npm audit || true).
      - name: 🔒 Audit dependencies
        continue-on-error: true
        run: uvx pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --no-deps

  # ============================================
  # STAGE 2: BUILD (Depende do Stage 1)
  # "needs" define dependências entre jobs
  # ============================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🏗️ Build image
        run: docker build --tag mecanica:latest .

      - name: 📦 Save image
        run: docker save mecanica:latest --output mecanica-image.tar

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mecanica-image
          path: mecanica-image.tar
          retention-days: 7

  # ============================================
  # STAGE 3: DEPLOY (Depende do Stage 2)
  # ============================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: mecanica-image

      - name: 📦 Load image
        run: docker load --input mecanica-image.tar

      - name: 🚀 Deploy
        run: |
          echo "Imagem pronta para deploy:"
          docker image ls mecanica:latest
          echo "Deploying..."

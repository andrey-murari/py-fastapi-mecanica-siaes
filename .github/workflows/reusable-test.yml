# ============================================
# REUSABLE WORKFLOW: Test
# Pode ser chamado por outros workflows
# ============================================
name: ?? Reusable Test

# ============================================
# WORKFLOW_CALL: Torna este workflow reutilizável
# Diferente de "on: push", este workflow só executa
# quando chamado por outro workflow
# ============================================
on:
  workflow_call:
    inputs:
      python-version:
        description: 'Versão do Python'
        required: false
        type: string
        default: '3.14.6'

jobs:
  test:
    name: ?? Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: ?? Checkout
        uses: actions/checkout@v4

      - name: ?? Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ inputs.python-version }}

      - name: ?? Set up Python
        run: uv python install ${{ inputs.python-version }}

      - name: ?? Install dependencies
        run: uv sync --locked --group dev

      - name: ?? Run tests
        run: uv run pytest

[project]
name = "py-fastapi-mecanica-siaes"
version = "0.1.0"
description = "Basic CRUD system for customer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "psycopg[binary]",
    "pytest>=9.1.1",
    "behave==1.3.3",
    "SQLAlchemy==2.0.51",
    "pylint>=4.0.7",
    "protocol>=0.37",
    "sqlmodel>=0.0.39",
    "pyjwt>=2.10.1",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]

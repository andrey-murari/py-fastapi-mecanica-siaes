# ============================================
# KUSTOMIZATION: BASE
# ============================================
# Configuração base do Kustomize
# Será usada como base para overlays (dev, prod)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ============================================
# RECURSOS
# ============================================
# Lista de manifests Kubernetes a serem gerenciados.
# O caminho é relativo a esta pasta.
resources:
- deployments.yaml                  # Deployment da API
- services.yaml                     # Service da API
- hpa.yaml
- secrets.yaml
- configmap.yaml

# ============================================
# LABELS COMUNS
# ============================================
# Carimbo em todos os recursos, sem alterar selectors.
# O label app fica em cada manifest: ele emparelha Pod e Service.
labels:
- pairs:
    managed-by: kustomize
  includeSelectors: false

# ============================================
# IMAGENS
# ============================================
# O "name" é o valor de image: no container, sem a tag.
# O "newName" troca o registry sem editar o Deployment.
images:
- name: mecanica-siaes
  newName: 090664595743.dkr.ecr.us-east-1.amazonaws.com/fiap-17soat/siaes-ci-cd
  newTag: latest
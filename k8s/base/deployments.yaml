apiVersion: apps/v1
kind: Deployment
metadata:
  name: mecanica-siaes
  labels:
    app: mecanica-siaes
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mecanica-siaes
  template:
    metadata:
      labels:
        app: mecanica-siaes
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          env:
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: prod-db-secret
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: MYSQL_PORT
          command:
            - sh
            - -c
            - until nc -z "$MYSQL_HOST" "$MYSQL_PORT"; do sleep 2; done
      containers:
        - name: mecanica-siaes
          image: mecanica-siaes:latest
          resources:
            requests:
              cpu: 100m
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          env:
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: prod-db-secret
                  key: MYSQL_HOST
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prod-db-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: MYSQL_DATABASE
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

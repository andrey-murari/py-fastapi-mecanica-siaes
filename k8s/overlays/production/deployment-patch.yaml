apiVersion: apps/v1
kind: Deployment
metadata:
  name: mecanica-siaes
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-mysql
        env:
        - name: MYSQL_HOST
          valueFrom:
            secretKeyRef:
              name: prod-db-secret
              key: MYSQL_HOST
      containers:
      - name: mecanica-siaes
        env:
        - name: MYSQL_HOST
          valueFrom:
            secretKeyRef:
              name: prod-db-secret
              key: MYSQL_HOST
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: prod-db-secret
              key: MYSQL_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"

# ============================================
# DEPLOYMENT PATCH: PRODUCTION
# ============================================
# Modifica recursos do deployment para produção
# Aumenta CPU e memória para suportar maior carga
apiVersion: apps/v1
kind: Deployment

# ============================================
# METADADOS
# ============================================
metadata:
  name: mecanica-siaes             # metadata.name do Deployment na base

# ============================================
# ESPECIFICAÇÃO
# ============================================
spec:
  template:
    spec:
      # namePrefix não altera strings. O Service do MySQL fica prod-mecanica-mysql-svc.
      initContainers:
      - name: wait-for-mysql
        command:
        - sh
        - -c
        - until nc -z prod-mecanica-mysql-svc 3306; do sleep 2; done
      containers:
      - name: mecanica-siaes       # Nome do container na base
        env:
        - name: MYSQL_HOST
          value: prod-mecanica-mysql-svc

        # ============================================
        # RECURSOS DE PRODUÇÃO
        # ============================================
        # Valores maiores que a base para suportar tráfego de produção
        resources:
          requests:                # Recursos mínimos garantidos
            memory: "256Mi"        # 2x da base (128Mi)
            cpu: "200m"            # 2x da base (100m)
          limits:                  # Limites máximos
            memory: "512Mi"        # 2x da base (256Mi)
            cpu: "500m"            # 2.5x da base (200m)
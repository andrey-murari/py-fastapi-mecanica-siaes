services:
  db:
    image: mysql:9.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: siae-dev
      MYSQL_DATABASE: siae
      MYSQL_USER: siae
      MYSQL_PASSWORD: siae
    ports:
      - 3307:3306
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psiae-dev"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  mecanica:
    image: mecanica:latest
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
    ports:
      - 8000:8000

volumes:
  db_data:
